schema_version = "1.0.0"
id = "harhtools"
version = "1.14.0"
name = "harhtools"
tagline = "Build editable curves, trim paths, array and align objects"
maintainer = "harhtools"
type = "add-on"
tags = ["Mesh", "Object", "Add Curve"]
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later"]

